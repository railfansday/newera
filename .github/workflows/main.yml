name: Scrape RSS & Generate HTML

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 1: Scrape RSS → isi database
      - name: Jalankan Scraper
        run: python scraper.py

      # STEP 2: Baca database → generate HTML + sitemap + robots
      - name: Jalankan Export
        run: python export.py

      # Upload artifact untuk debug
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-html
          path: |
            semua_artikel.html
            artikel_part1.html
            artikel_part2.html
            sitemap.xml
            robots.txt
          retention-days: 3

      # Commit & push hasil
      - name: Commit & Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add semua_artikel.html artikel_part1.html artikel_part2.html sitemap.xml robots.txt
          git diff --staged --quiet && echo "Tidak ada perubahan" && exit 0
          git commit -m "Update otomatis dari GitHub Actions [skip ci]"
          git pull --rebase origin main || true
          git push
